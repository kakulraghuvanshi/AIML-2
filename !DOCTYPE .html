<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopKart - Ecommerce</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}
body{
background:white;
}
.navbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 40px;
background:black;
color:white;
position:relative;
}
.logo{
font-size:26px;
font-weight:bold;
color:#ff9900;
letter-spacing:1px;
}
.nav-links{
list-style:none;
display:flex;
gap:25px;
}
.nav-links a{
text-decoration:none;
color:white;
font-size:16px;
transition:0.3s;
}
.nav-links a:hover{
color:#ff9900;
}
.search-box{
display:flex;
background:white;
border-radius:4px;
overflow:hidden;
}
.search-box input{
border:none;
padding:8px 12px;
outline:none;
width:260px;
}
.search-box button{
border:none;
background:#febd69;
padding:8px 14px;
cursor:pointer;
font-size:16px;
}
.icons{
display:flex;
gap:20px;
}
.icons a{
color:white;
text-decoration:none;
font-size:15px;
}
.menu-icon{
display:none;
font-size:26px;
cursor:pointer;
}
#menu-toggle{
display:none;
}
@media(max-width: 900px){
.search-box input{
width:150px;
}
.nav-links{
gap:15px;
}
}
@media(max-width: 700px){
.navbar{
padding:12px 20px;
}
.menu-icon{
display:block;
}
.nav-links{
position:absolute;
top:60px;
left:0;
width:100%;
background:#232f3e;
flex-direction:column;
align-items:center;
max-height:0;
overflow:hidden;
transition:0.4s ease;
}
.nav-links li{
padding:15px 0;
width:100%;
text-align:center;
border-top:1px solid #444;
}
#menu-toggle:checked ~ .nav-links{
max-height:350px;
}
.search-box{
display:none;
}
.icons{
display:none;
}
}
</style>
</head>
<body>
<header>
<nav class="navbar">
<div class="logo">ShopKart</div>
<input type="checkbox" id="menu-toggle">
<label for="menu-toggle" class="menu-icon">&#9776;</label>
<ul class="nav-links">
<li><a href="#">Home</a></li>
<li><a href="#">Men</a></li>
<li><a href="#">Women</a></li>
<li><a href="#">Electronics</a></li>
<li><a href="#">Offers</a></li>
<li><a href="#">Contact</a></li>
</ul>
<div class="search-box">
<input type="text" placeholder="Search for products, brands and more">
<button></button>
</div>
<div class="icons">
<a href="#">Login</a>
<a href="#">Cart</a>
</div>
</nav>
</header>
</body>
</html>
</style>
</head>
<body>
</body>
</html>
