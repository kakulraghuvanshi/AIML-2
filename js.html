!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object in js</title>
</head>
<body>
   <script>
    //object - it is collectionb of keys(property) and its value.
    //create object - literal{} and new keyword
    //create object for student
    let student={
     id:101,
     name:"Kakul",
     age:18,
     isMarried:false,
     address:{
         streetNo:8,
         area:"khandala",
         pincode:201009,
         city:"gzb"
     },
     education:["BTech","CSE",18,2025],
     getInfo:function(){
      return "my details are "+ student.id + " and " + student.name; 
     },
     examDone:null
    };
    
    //console.log(student);
    //console.log(typeof(student));
    //access objects properties/keys using dot notation
    console.log(student.getInfo());
     console.log(student.address);
     console.log(student.education[2]);//getting value from array index 
     console.log(student.address.pincode);//getting a particular detail  from function
     //find object's key in object
     console.log('id'in student);
     //delete object's key from object
     console.log(delete student.name);//this will  delete students name from the object
     console.log(student)//now students details will be printed without student's name
     //object's length
     let StudentKeys=Object.keys(student);
     console.log(StudentKeys.length);
     //for loop
     for(let x in student){
     console.log(student[x]);}

     for(let x=0;x<StudentKeys.length;x++){
        console.log(StudentKeys[x]);
     }

    

   </script> 
</body>
</html>
